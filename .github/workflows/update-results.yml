# 開催中の甲子園の試合結果を Wikipedia から取り直し、変化があればコミットする。
#
# コミットすると Vercel が自動でデプロイし、サイトに反映される。
#
# **service_role キーは使わない。** 読み取りに anon キーを使うだけで、
# 書き込み先はDBではなくリポジトリ。RLSを迂回するキーをCIに置かずに済む。
# 差分がGitに残るので、Wikipediaが荒らされても後から追える。
#
# 手で走らせたいときは Actions タブから "Run workflow"（workflow_dispatch）。
name: 結果速報の更新

on:
  schedule:
    # 3時間おき。大会が無い時期は記事が変わらないので、単に何もコミットしない。
    # cronはUTC。日本時間だと 0,3,6,9,12,15,18,21 時。
    - cron: "0 */3 * * *"
  workflow_dispatch:

# 生成物をコミットするために必要
permissions:
  contents: write

# 同時に走らせない。前の実行が終わる前に次が来るとコミットが衝突する。
concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # 生成スクリプトは @supabase/supabase-js しか使わないが、
      # lockfile どおりに入れておくほうが再現性がある。
      - run: npm ci

      - name: 試合結果を取り直す
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/build-live-results.mjs

      - name: 型が通るか確かめる
        # 壊れた生成物をコミットしないための保険。
        run: npx tsc --noEmit

      - name: 変化があればコミットする
        run: |
          if git diff --quiet -- src/lib/data/live-results.ts; then
            echo "変化なし。コミットしない。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/live-results.ts
          git commit -m "結果速報を更新（自動）"
          git push
