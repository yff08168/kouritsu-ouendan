# 開催中の甲子園の試合結果を**日本高野連の公式サイト**から取り直し、
# 変化があればコミットする。
#
# コミットすると Vercel が自動でデプロイし、サイトに反映される。
#
# **service_role キーは使わない。** 読み取りに anon キーを使うだけで、
# 書き込み先はDBではなくリポジトリ。RLSを迂回するキーをCIに置かずに済む。
# 差分がGitに残るので、出典側が変わっても後から追える。
#
# 大会が無い時期は高野連にその年のページがまだ無い。スクリプトは
# 何も書き換えずに正常終了するので、CIが失敗し続けることはない。
#
# 手で走らせたいときは Actions タブから "Run workflow"（workflow_dispatch）。
name: 結果速報の更新

on:
  schedule:
    # 3時間おき。大会が無い時期は記事が変わらないので、単に何もコミットしない。
    # cronはUTC。日本時間だと 0,3,6,9,12,15,18,21 時。
    - cron: "0 */3 * * *"
  workflow_dispatch:

# 生成物をコミットするために必要
permissions:
  contents: write

# 同時に走らせない。前の実行が終わる前に次が来るとコミットが衝突する。
concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # v4 は実行環境が Node.js 20 で、GitHub が非推奨の警告を出す。
      # v5 は Node.js 24 で動く。（下の node-version はスクリプトを動かす
      # Node のバージョンで、アクション自体の実行環境とは別物）
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      # 生成スクリプトは @supabase/supabase-js しか使わないが、
      # lockfile どおりに入れておくほうが再現性がある。
      - run: npm ci

      - name: 試合結果を取り直す
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/build-live-results.mjs

      - name: 型が通るか確かめる
        # 壊れた生成物をコミットしないための保険。
        run: npx tsc --noEmit

      - name: 変化があればコミットする
        run: |
          if git diff --quiet -- src/lib/data/live-results.ts; then
            echo "変化なし。コミットしない。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/live-results.ts
          git commit -m "結果速報を更新（自動）"
          git push
